# Server
server.port=8080
server.tomcat.socket.so-linger=-1

# Voice RAG Configuration
voicerag.recordings-dir=${HOME}/Documents/NCA Recordings
voicerag.transcripts-dir=${HOME}/voice-rag-java/transcripts
voicerag.whisper-model=base
voicerag.chunk-size=500
voicerag.chunk-overlap=50

# MCP Server
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp
spring.ai.mcp.server.name=voice-rag
spring.ai.mcp.server.version=1.0.0
